<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="html_form.css">
  <title>Document</title>
</head>
<body>
  <fieldset ">
    <h2>LOGIN DETAILS</h2>
    <hr style="width: 600px; height: 3px; background-color: black; ;"> 
    <br>
<form action="" method="post" > 
USERNAME: <input type="text" name="uname" placeholder="Enter your name"><br>
<br>
PASSWORD: <input type="password" name="password" placeholder="Enter your password"><br>
<br>
EMAIL:
<input type="email" name="email" placeholder="Enter your email"><br>
<br>
MOBILE: 
<input type="number" name="no." pattern="[0,9] {10}" placeholder="Enter your number"><br>
<br>
TELEPHONE: 
<input type="tel" name="tel no" value="" placeholder="Enter telephone number"> <br>
<br>
<hr>
GENDER: <br>
MALE:<input type="radio" name="gender" value="Male">
FEMALE: <input type="radio" name="gender" value="Female"><br>
<br>
SELECT LANGUAGE: <br>
C<input type="checkbox" >&nbsp;&nbsp;
C++<input type="checkbox" >&nbsp;&nbsp;
HTML<input type="checkbox" >&nbsp;&nbsp;
CSS<input type="checkbox" >&nbsp;&nbsp;
JS<input type="checkbox" >&nbsp;&nbsp;<br>
<br>
<hr>
AGE:<br>
<input type="number" pattern="[0,9] {2}" placeholder="00"><br>
<br>
TIME:
<input type="time" value="00:00"><br>
<br>
WEEK:
<input type="week" value="00,sunday"><br>
<br>
MONTH & YEAR: 
<input type="month"><br>
<br>
BIRTHDATE: 
<input type="date"><br>
<br>
<hr>
UPLOAD FILE: 
<input type="file" name="file" value="" placeholder="choose file"><br>
<br>
SELECT RANGE : 
<input type="range" name="range" id="" pattern="[0,100] {1}" > <br>
<br>
SELECT COLOR : 
<input type="color" name="color" id=""  > <br>
<br>
URL:
<input type="url" placeholder="Enter URL"><br>
<br>
<input type="submit"> &nbsp; &nbsp; <input type="reset"><br>
</form><br>
<br>
</fieldset>
</body>
</html>
